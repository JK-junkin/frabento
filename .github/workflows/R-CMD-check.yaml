name: R-CMD-check

on:
  push:
    branches: [main, dev]

  pull_request:
    branches: [main, dev]

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    name: ${{ matrix.os }} / R-${{ matrix.r-version }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

        r-version:
          - release
          - devel
          - oldrel-1

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
          cache-version: 1

      - name: Session info
        run: sessionInfo()
        shell: Rscript {0}

      - name: Check package
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          NOT_CRAN: false
        run: |
          options(
            crayon.enabled = TRUE,
            cli.num_colors = 256
          )

          rcmdcheck::rcmdcheck(
            args = c(
              "--no-manual",
              "--as-cran"
            ),
            build_args = c("--no-manual"),
            error_on = "warning",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          find check -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-R-${{ matrix.r-version }}-check-results
          path: check
